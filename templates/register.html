<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0EA5E9" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <title>Register - Voiceprint Identity System</title>
  <meta name="description" content="Create account - Voice Authentication Checkpoint System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    /* -- Voice Checkpoint Theme (Darker Blue & Muted Red Palette) ------ */
    :root {
      --bg-dark: #0A0A0C;
      --bg-dark2: #14141C;
      --accent-light: #0EA5E9;
      --accent: #0EA5E9;
      --accent-strong: #0369A1;
      --blue: #0EA5E9;
      /* Primary darker blue accent */
      --blue-glow: #0EA5E9;
      /* Secondary glow accent */
      --text: #E0F2FE;
      /* Headings and emphasis text */
      --subtext: #CDD6F4;
      /* Body and secondary text */
      --amethyst: #0EA5E9;
      /* Live recording/scan sweep active state */
      --danger: #F87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --danger-border: rgba(248, 113, 113, 0.25);
      --emerald: #50C878;
      --ruby: var(--danger);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0A0A0F;
      color: var(--subtext);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.4) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(3, 105, 161, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.35) 0%, transparent 50%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* -- Ambient blobs -------------------------------------------------- */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.22;
      animation: drift 22s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 480px;
      height: 480px;
      background: #0369A1;
      top: -160px;
      left: -120px;
      animation-duration: 22s;
    }

    .blob-2 {
      width: 380px;
      height: 380px;
      background: #0EA5E9;
      bottom: -100px;
      right: -80px;
      animation-duration: 28s;
    }

    .blob-3 {
      width: 260px;
      height: 260px;
      background: #0369A1;
      top: 40%;
      left: 55%;
      animation-duration: 20s;
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(60px, 40px) scale(1.08);
      }

      100% {
        transform: translate(-40px, 80px) scale(0.95);
      }
    }

    /* -- Checkpoint Card Frame ------------------------------------------ */
    .reg-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 16px;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    }

    .reg-wrap.unlocking {
      transform: scale(0.95);
      opacity: 0;
    }

    .reg-card {
      background: rgba(255, 255, 255, 0.08);
      /* lighter than before - too dark = no glass look */
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      position: relative;
      z-index: 1;
      overflow: hidden;
      padding: 38px 36px 32px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .reg-card:hover {
      border-color: rgba(14, 165, 233, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(14, 165, 233, 0.4);
    }

    /* the glossy diagonal shine seen in the reference image */
    .reg-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg,
          rgba(255, 255, 255, 0.15) 0%,
          rgba(255, 255, 255, 0.03) 30%,
          transparent 60%);
      pointer-events: none;
    }

    /* -- Waveform Border Chrome ----------------------------------------- */
    .card-waveform-chrome {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 24px;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }

    .reg-card:hover .card-waveform-chrome,
    .reg-wrap.unlocking .card-waveform-chrome {
      opacity: 0.95;
    }

    .waveform-path-bg {
      stroke: rgba(14, 165, 233, 0.4);
      stroke-dasharray: 8 4;
      animation: waveFlow 15s linear infinite;
    }

    @keyframes waveFlow {
      0% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: 200;
      }
    }

    /* -- Radial Voice-Scan Ring ----------------------------------------- */
    .scan-ring-container {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.4));
    }

    .ring-track {
      stroke: rgba(14, 165, 233, 0.2);
      animation: scanPulse 3s ease-in-out infinite alternate;
    }

    @keyframes scanPulse {
      0% {
        stroke-opacity: 0.2;
      }

      100% {
        stroke-opacity: 0.6;
      }
    }

    .ring-progress {
      stroke: var(--accent-strong);
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.3s ease;
    }

    .scan-ring-icon {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .mic-icon-svg {
      width: 38px;
      height: 38px;
      stroke: var(--accent);
      filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.4));
    }

    /* -- Header -------------------------------------------------------- */
    .reg-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.95rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FE 50%, #0EA5E9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .reg-subtitle {
      text-align: center;
      font-size: 0.75rem;
      color: var(--subtext);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    /* -- Credential Slot Fields ----------------------------------------- */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: rgba(10, 10, 14, 0.6);
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px 8px 0 0;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      padding: 11px 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .field input:focus {
      background: rgba(15, 15, 22, 0.8);
      border-bottom-color: #0EA5E9;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
    }

    .field input::placeholder {
      color: rgba(205, 214, 244, 0.35);
    }

    .field-hint {
      font-size: 0.68rem;
      color: rgba(205, 214, 244, 0.5);
      margin-top: 5px;
    }

    /* -- Error Notice -------------------------------------------------- */
    .error-msg {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      color: var(--danger);
      font-size: 0.82rem;
      padding: 10px 14px;
      margin-bottom: 18px;
      animation: shake 0.35s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    /* -- Submit Button with Dial Flanks --------------------------------- */
    .reg-btn {
      width: 100%;
      background: linear-gradient(135deg, #0369A1, #0EA5E9);
      border: 1px solid rgba(14, 165, 233, 0.4);
      border-radius: 999px;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 13px;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 18px rgba(3, 105, 161, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .reg-btn:hover {
      background: linear-gradient(135deg, #0369A1, #0EA5E9);
      border-color: #0EA5E9;
      box-shadow: 0 6px 22px rgba(14, 165, 233, 0.5);
      transform: translateY(-1px);
    }

    .btn-ticks {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.75rem;
      letter-spacing: -1px;
    }

    /* -- Footer text --------------------------------------------------- */
    .auth-switch {
      text-align: center;
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--subtext);
    }

    .auth-switch a {
      color: #38BDF8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-switch a:hover {
      color: #E0F2FE;
    }

    .reg-caption {
      text-align: center;
      font-size: 0.68rem;
      color: rgba(205, 214, 244, 0.45);
      margin-top: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <!-- Ambient blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="reg-wrap" id="regWrap">
    <div class="reg-card">

      <!-- Waveform Border Chrome -->
      <div class="card-waveform-chrome">
        <svg width="100%" height="24" viewBox="0 0 400 24" preserveAspectRatio="none">
          <path class="waveform-path-bg" d="M0,12 Q25,4 50,12 T100,12 T150,12 T200,12 T250,12 T300,12 T350,12 T400,12"
            fill="none" stroke-width="1.5" />
        </svg>
      </div>

      <!-- Radial Voice-Scan Ring -->
      <div class="scan-ring-container">
        <svg class="scan-ring-svg" viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42" fill="none" stroke-width="2.5" />
          <circle class="ring-progress" id="scanArc" cx="50" cy="50" r="42" fill="none" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="263.89" transform="rotate(-90 50 50)" />
        </svg>
        <div class="scan-ring-icon">
          <svg class="mic-icon-svg" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
      </div>

      <h1 class="reg-title">REGISTER</h1>
      <p class="reg-subtitle">Biometric Authentication Terminal</p>

      {% if error %}
      <div class="error-msg" role="alert">

        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form id="regForm" method="POST" action="/register" autocomplete="off" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required
            autofocus />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="********" autocomplete="new-password"
            required />
          <p class="field-hint">Choose a strong password - it is stored hashed.</p>
        </div>

        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" placeholder="********" autocomplete="new-password"
            required />
        </div>

        <button type="submit" class="reg-btn" id="submitBtn">
          <span class="btn-ticks">| | |</span>
          <span>Register Account</span>
          <span class="btn-ticks">| | |</span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Sign In</a></p>
      <p class="reg-caption">Local Biometric Verification</p>
    </div>
  </div>

  <script>
    // Vault-Unlock transition on form submit
    document.getElementById('regForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const wrap = document.getElementById('regWrap');
      const arc = document.getElementById('scanArc');

      // Rapidly fill scan ring + unlock transition
      arc.style.strokeDashoffset = '0';
      wrap.classList.add('unlocking');

      setTimeout(() => {
        e.target.submit();
      }, 550);
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>

</body>

</html>
